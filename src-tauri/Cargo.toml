[package]
name = "shellx"
version = "0.1.0"
description = "ShellX - secure terminal with a local MCP server for AI agents"
authors = ["Amiya"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "shellx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
