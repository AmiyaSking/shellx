[package]
name = "shellx"
version = "0.1.0"
description = "ShellX - secure terminal with a local MCP server for AI agents"
authors = ["Amiya"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "shellx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
# SSH transport for the interactive terminal.
# `ring` instead of the default `aws-lc-rs`: aws-lc-sys needs NASM at build time.
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
# Passwords and key passphrases go to the OS credential store, never to disk.
# Linux uses the kernel keyring here; a Secret Service backend can be enabled
# later without changing the vault API.
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
